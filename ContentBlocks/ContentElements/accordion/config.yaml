name: psbits/accordion
fields:
  - identifier: header
    useExistingField: true
  - identifier: accordion_style
    default: flush
    type: Select
    renderType: selectSingle
    items:
      - label: Flush
        value: flush
      - label: Card
        value: card
  - identifier: accordion_items
    foreign_field: parent_uid
    foreign_table: tt_content
