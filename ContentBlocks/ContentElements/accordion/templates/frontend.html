<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
<f:if condition="{data._grids.accordion_items}">
    <f:if condition="{data.header} && {data.header_layout} != 100">
        <viewHelpers:tag
            class="mb-3"
            tag="h{viewHelpers:fallback(values: '{0: data.header_layout, 1: 2}')}">
            {data.header}
        </viewHelpers:tag>
    </f:if>

    <div class="accordion{f:if(condition: data.accordion_style == 'flush', then: ' accordion-flush')}" id="accordion-{data.uid}">
        <f:for as="item" each="{data._grids.accordion_items}" iteration="iteration">
            <f:variable name="panelId" value="accordion-{data.uid}-{iteration.index}" />
            <div class="accordion-item">
                <f:render
                    partial="Component/Collapsible"
                    arguments="{
                        classes: 'accordion-button',
                        collapseClass: 'accordion-collapse',
                        content: item.content,
                        contentAttributes: {data-bs-parent: '#accordion-{data.uid}'},
                        id: panelId,
                        initiallyOpen: iteration.isFirst,
                        label: item.data.header,
                        tag: 'button'
                    }" />
            </div>
        </f:for>
    </div>
</f:if>
</html>
