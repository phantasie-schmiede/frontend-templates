name: psbits/cta
fields:
  - identifier: header
    useExistingField: true
  - identifier: header_link
    useExistingField: true
  - identifier: bootstrap_type
    default: primary
    renderType: selectSingle
    type: Select
    items:
      - label: Primary
        value: primary
      - label: Secondary
        value: secondary
      - label: Success
        value: success
      - label: Danger
        value: danger
      - label: Warning
        value: warning
      - label: Info
        value: info
      - label: Light
        value: light
      - label: Dark
        value: dark
  - identifier: button_size
    default: md
    renderType: selectSingle
    type: Select
    items:
      - label: Default
        value: md
      - label: Small
        value: sm
      - label: Large
        value: lg
  - identifier: full_width
    default: false
    type: Check
group: content_blocks
labelField: header
prefixType: vendor
vendorPrefix: tx_templates
