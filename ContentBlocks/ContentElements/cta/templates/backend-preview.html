<f:layout name="Preview" />

<f:section name="Content">
    <f:if condition="{data.header_link}">
        <f:then>
            <f:link.typolink
                class="btn btn-{data.bootstrap_type}{f:if(condition: '\md\' != {data.button_size}', then: ' btn-{data.button_size}')}{f:if(condition: data.full_width, then: ' w-100')}"
                parameter="{data.header_link}">
                {data.header}
            </f:link.typolink>
        </f:then>
        <f:else>
            <span class="text-muted">
                <f:translate
                    key="LLL:EXT:templates/ContentBlocks/ContentElements/cta/language/labels.xlf:preview.link_required" />
            </span>
        </f:else>
    </f:if>
</f:section>
