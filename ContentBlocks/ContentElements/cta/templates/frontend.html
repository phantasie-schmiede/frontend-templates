<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <f:if condition="{data.header} && {data.header_link}">
        <f:link.typolink
            class="btn btn-{data.bootstrap_type}{f:if(condition: '\md\' != {data.button_size}', then: ' btn-{data.button_size}')}{f:if(condition: data.full_width, then: ' w-100')}"
            parameter="{data.header_link}">
            {data.header}
        </f:link.typolink>
    </f:if>
</html>
