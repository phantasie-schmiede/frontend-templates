<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
    <section
        aria-labelledby="faq-title-{data.uid}"
        class="py-4">
        <div class="container">
            <f:if condition="{data.header}">
                <f:if condition="{data.header_layout} != 100">
                    <viewHelpers:tag
                        additionalAttributes="{id: 'faq-title-{data.uid}'}"
                        tag="h{viewHelpers:fallback(values: '{0: data.header_layout, 1: 2}')}">
                        {data.header}
                    </viewHelpers:tag>
                </f:if>
            </f:if>
            <f:if condition="{data.introtext}">
                <p class="lead">{data.introtext}</p>
            </f:if>

            <div
                class="accordion"
                id="faq-{data.uid}">
                <f:for
                    as="item"
                    each="{data._grids.faq_items}"
                    iteration="iteration">
                    <f:variable
                        name="faqId"
                        value="faq-{data.uid}-{iteration.index}" />
                    <div class="accordion-item">
                        <f:render
                            arguments="{
                                classes: 'accordion-button',
                                collapseClass: 'accordion-collapse',
                                content: item.content,
                                contentAttributes: {data-bs-parent: '#faq-{data.uid}'},
                                id: faqId,
                                initiallyOpen: iteration.isFirst,
                                label: item.data.header,
                                tag: 'button'
                            }"
                            partial="Component/Collapsible" />
                    </div>
                </f:for>
            </div>

            <script type="application/ld+json">
                {
                    "@context": "https://schema.org",
                    "@type": "FAQPage",
                    "mainEntity": [
                        <f:for as="item" each="{data._grids.faq_items}" iteration="iteration">
                            {
                                "@type": "Question",
                                "name": "{item.data.header -> f:format.htmlspecialchars()}",
                                "acceptedAnswer": {
                                    "@type": "Answer",
                                    "text": "{item.data.bodytext -> f:format.stripTags() -> f:format.htmlspecialchars()}"
                                }
                            }<f:if condition="!{iteration.isLast}">,</f:if>
                        </f:for>
                    ]
                }
            </script>
        </div>
    </section>
</html>
