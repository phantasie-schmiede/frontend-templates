<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
    <f:variable
        name="sectionAttributes"
        value="{}" />
    <f:if condition="{data.header} && 100 != {data.header_layout}">
        <f:variable
            name="sectionAttributes"
            value="{aria-labelledby: 'faq-title-{data.uid}'}" />
    </f:if>
    <viewHelpers:tag
        additionalAttributes="{sectionAttributes}"
        class="content-block-section"
        tag="section">
        <div class="container">
            <f:if condition="{data.header}">
                <f:if condition="{data.header_layout} != 100">
                    <viewHelpers:tag
                        additionalAttributes="{id: 'faq-title-{data.uid}'}"
                        tag="h{viewHelpers:fallback(values: '{0: data.header_layout, 1: 2}')}">
                        {data.header}
                    </viewHelpers:tag>
                </f:if>
            </f:if>
            <f:if condition="{data.introtext}">
                <p class="lead">{data.introtext}</p>
            </f:if>

            <div
                class="accordion accordion-cards d-grid gap-3"
                id="faq-{data.uid}">
                <f:for
                    as="item"
                    each="{data._grids.faq_items}"
                    iteration="iteration">
                    <f:variable
                        name="faqId"
                        value="faq-{data.uid}-{iteration.index}" />
                    <div class="accordion-item border rounded">
                        <f:render
                            arguments="{
                                bodyClass: 'accordion-body',
                                classes: 'accordion-button',
                                collapseClass: 'accordion-collapse',
                                content: item.content,
                                contentAttributes: {data-bs-parent: '#faq-{data.uid}'},
                                headingTag: 'h3',
                                id: faqId,
                                initiallyOpen: iteration.isFirst,
                                label: item.data.header,
                                tag: 'button'
                            }"
                            partial="Component/Collapsible" />
                    </div>
                </f:for>
            </div>

            <script type="application/ld+json">
                {
                    "@context": "https://schema.org",
                    "@type": "FAQPage",
                    "mainEntity": [
                        <f:for as="item" each="{data._grids.faq_items}" iteration="iteration">
                            {
                                "@type": "Question",
                                "name": <f:format.raw><f:format.json value="{item.data.header}" /></f:format.raw>,
                                "acceptedAnswer": {
                                    "@type": "Answer",
                                    "text": <f:format.raw><f:format.json value="{item.data.bodytext -> f:format.stripTags()}" /></f:format.raw>
                                }
                            }<f:if condition="!{iteration.isLast}">,</f:if>
                        </f:for>
                    ]
                }
            </script>
        </div>
    </viewHelpers:tag>
</html>
