name: psbits/feature
fields:
  - identifier: header
    useExistingField: true
  - identifier: bodytext
    enableRichtext: true
    useExistingField: true
  - identifier: image
    cropVariants:
      default:
        title: Default
        allowedAspectRatios:
          default:
            title: "16:9"
            value: 16 / 9
    maxitems: 1
    minitems: 1
    useExistingField: true
  - identifier: layout_variant
    default: image-left
    renderType: selectSingle
    type: Select
    items:
      - label: Image left
        value: image-left
      - label: Image right
        value: image-right
      - label: Stacked
        value: stacked
  - identifier: background_variant
    default: default
    renderType: selectSingle
    type: Select
    items:
      - label: Default
        value: default
      - label: Light
        value: light
      - label: Dark
        value: dark
  - identifier: links
    allowedRecordTypes:
      - psbits_cta
    foreign_field: parent_uid
    foreign_table: tt_content
    maxitems: 2
    minitems: 0
    shareAcrossFields: true
    type: Collection
group: content_blocks
labelField: header
prefixType: vendor
vendorPrefix: tx_templates
