<f:layout name="Preview"/>

<f:section name="Content">
    <f:if condition="{data.header}">
        <strong>{data.header}</strong>
    </f:if>

    <div class="mt-2">
        <f:sanitize.html>{data.bodytext}</f:sanitize.html>
    </div>

    <div class="text-muted">
        Layout: {data.layout_variant} | Background: {data.background_variant}
    </div>

    <f:render partial="PageLayout/Grid" arguments="{data: data, identifier: 'links'}"/>
</f:section>
