<f:layout name="Preview" />

<f:section name="Content">
    <f:if condition="{data.header}">
        <strong>{data.header}</strong>
    </f:if>

    <div class="mt-2">
        <f:sanitize.html>{data.bodytext}</f:sanitize.html>
    </div>

    <f:if condition="{data.image.0}">
        <div class="mt-2">
            <f:render
                arguments="{
                    alt: '{f:translate(key: \'LLL:EXT:templates/ContentBlocks/ContentElements/feature/language/labels.xlf:preview.image\')}',
                    height: 135,
                    image: data.image.0,
                    width: 240
                }"
                partial="Component/Picture/Responsive" />
        </div>
    </f:if>

    <div class="text-muted">
        <f:translate key="LLL:EXT:templates/ContentBlocks/ContentElements/feature/language/labels.xlf:preview.layout" />
        {data.layout_variant} |
        <f:translate key="LLL:EXT:templates/ContentBlocks/ContentElements/feature/language/labels.xlf:preview.background" />
        {data.background_variant}
    </div>

    <f:render
        arguments="{data: data, identifier: 'links'}"
        partial="PageLayout/Grid" />
</f:section>
