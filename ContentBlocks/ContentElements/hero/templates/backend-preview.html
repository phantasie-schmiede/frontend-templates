<f:layout name="Preview" />

<f:section name="Content">
    <strong>{data.header}</strong>
    <div class="text-muted">
        <f:translate key="LLL:EXT:templates/ContentBlocks/ContentElements/hero/language/labels.xlf:preview.type" />
    </div>
    <f:sanitize.html>{data.bodytext}</f:sanitize.html>

    <f:if condition="{data.image.0}">
        <div class="mt-2">
            <f:render
                arguments="{
                    alt: '{f:translate(key: \'LLL:EXT:templates/ContentBlocks/ContentElements/hero/language/labels.xlf:preview.image\')}',
                    height: 135,
                    image: data.image.0,
                    width: 240
                }"
                partial="Component/Picture/Responsive" />
        </div>
    </f:if>
</f:section>
