<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:templates="http://typo3.org/ns/PSBits/Templates/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
    <templates:page.header identifier="preloadHero">
        <templates:format.reduceWhitespace>
            <f:render
                arguments="{file: data.image.0}"
                partial="Component/Picture/Preload" />
        </templates:format.reduceWhitespace>
    </templates:page.header>

    <f:variable
        name="containerClass"
        value="container" />
    <f:variable
        name="currentPage"
        value="{templates:globalVariables.currentPage()}" />

    <f:if condition="{currentPage.tx_templates_bs_container_type}">
        <f:variable
            name="containerClass"
            value="container-{currentPage.tx_templates_bs_container_type}" />
    </f:if>

    <f:if condition="{data.text_align} != 'center'">
        <f:variable
            name="textConstraintClass"
            value=" hero-block__text--constrained" />
    </f:if>

    <f:if condition="{data.show_overlay}">
        <f:variable
            name="overlayClass"
            value=" hero-block--overlay" />
        <f:switch expression="{data.text_align}">
            <f:case value="end">
                <f:variable
                    name="overlayClass"
                    value="{overlayClass} hero-block--overlay-end" />
                <f:variable
                    name="headingClass"
                    value=" ms-auto" />
            </f:case>
            <f:case value="start">
                <f:variable
                    name="overlayClass"
                    value="{overlayClass} hero-block--overlay-start" />
            </f:case>
        </f:switch>
    </f:if>

    <f:variable
        name="metaAlignment"
        value="end" />

    <f:if condition="{data.show_overlay} && 'start' == {data.text_align}">
        <f:variable
            name="metaAlignment"
            value="start" />
    </f:if>

    <f:switch expression="{data.text_align}">
        <f:case value="center">
            <f:variable
                name="leadClass"
                value=" mx-auto" />
        </f:case>
        <f:case value="end">
            <f:variable
                name="leadClass"
                value=" ms-auto" />
        </f:case>
    </f:switch>

    <section
        class="hero-block{overlayClass} position-relative text-{data.text_align}">
        <f:render
            arguments="{
                figureClass: 'hero-block__figure position-relative',
                file: data.image.0,
                imageClass: 'h-auto hero-block__image w-100',
                loading: '{f:if(condition: data.eager_loading, then: \'eager\')}',
                metaAlignment: metaAlignment,
                metaPosition: 'overlay'
            }"
            partial="Component/Picture/Responsive" />

        <div
            class="{containerClass} hero-block__content position-absolute start-50 text-{data.text_align} top-50 translate-middle">
            <f:if condition="{data.header}">
                <f:if condition="{data.header_layout} != 100">
                    <viewHelpers:tag
                        class="display-5{headingClass}{textConstraintClass}"
                        tag="h{viewHelpers:fallback(values: '{0: data.header_layout, 1: 1}')}">
                        {data.header}
                    </viewHelpers:tag>
                </f:if>
            </f:if>

            <f:if condition="{data.bodytext}">
                <div
                    class="hero-block__lead lead mb-4{leadClass}{textConstraintClass}">
                    <f:format.html>{data.bodytext}</f:format.html>
                </div>
            </f:if>

            <f:if condition="{data.cta_label}">
                <f:link.typolink
                    class="btn btn-primary"
                    parameter="{data.header_link}">
                    {data.cta_label}
                </f:link.typolink>
            </f:if>
        </div>
    </section>
</html>
