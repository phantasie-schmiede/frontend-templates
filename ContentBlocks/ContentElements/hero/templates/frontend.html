<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
    <section class="hero-block position-relative text-{data.text_align}">
        <f:render
            arguments="{
                image: data.image.0,
                imageClass: 'hero-block__image w-100',
                loading: data.eager_loading ? 'eager' : 'lazy',
                sizes: {
                    1400: 1920,
                    1200: 1600,
                    992: 1400,
                    768: 1200,
                    576: 992,
                    0: 640
                }
            }"
            partial="Component/Picture/Responsive" />

        <f:if condition="{data.show_overlay}">
            <div class="hero-block__overlay"></div>
        </f:if>

        <div class="container hero-block__content position-absolute start-50 text-{data.text_align} top-50 translate-middle">
            <f:if condition="{data.header}">
                <f:if condition="{data.header_layout} != 100">
                    <viewHelpers:tag
                        class="display-5"
                        tag="h{viewHelpers:fallback(values: '{0: data.header_layout, 1: 1}')}">
                        {data.header}
                    </viewHelpers:tag>
                </f:if>
            </f:if>
            <f:if condition="{data.bodytext}">
                <div class="lead mb-4">
                    <f:format.html>{data.bodytext}</f:format.html>
                </div>
            </f:if>
            <f:if condition="{data.header_link}">
                <f:link.typolink
                    class="btn btn-primary"
                    parameter="{data.header_link}">
                    {data.cta_label}
                </f:link.typolink>
            </f:if>
        </div>
    </section>
</html>
