<f:layout name="Preview" />

<f:section name="Content">
    <f:if condition="{data.header}">
        <strong>{data.header}</strong>
    </f:if>

    <div class="mt-2">
        <f:translate
            key="LLL:EXT:frontend_templates/ContentBlocks/ContentElements/slider/language/labels.xlf:preview.slides" />
        <f:count subject="{data.image}" />
    </div>

    <f:if condition="{data.image}">
        <div class="d-flex flex-wrap gap-2 mt-2">
            <f:for
                as="image"
                each="{data.image}"
                iteration="iteration">
                <f:if condition="{iteration.cycle} <= 4">
                    <f:image
                        alt="{f:translate(key: 'LLL:EXT:frontend_templates/ContentBlocks/ContentElements/slider/language/labels.xlf:preview.image')}"
                        image="{image}"
                        maxHeight="68"
                        maxWidth="120" />
                </f:if>
            </f:for>
        </div>
    </f:if>
</f:section>
