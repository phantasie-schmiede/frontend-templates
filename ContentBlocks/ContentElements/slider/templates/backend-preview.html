<f:layout name="Preview" />

<f:section name="Content">
    <f:if condition="{data.header}">
        <strong>{data.header}</strong>
    </f:if>

    <div class="mt-2">
        <f:translate key="LLL:EXT:templates/ContentBlocks/ContentElements/slider/language/labels.xlf:preview.slides" />
        <f:count subject="{data.image}" />
    </div>

    <f:if condition="{data.image}">
        <div class="d-flex flex-wrap gap-2 mt-2">
            <f:for
                as="image"
                each="{data.image}"
                iteration="iteration">
                <f:if condition="{iteration.cycle} <= 4">
                    <f:render
                        arguments="{
                            alt: '{f:translate(key: \'LLL:EXT:templates/ContentBlocks/ContentElements/slider/language/labels.xlf:preview.image\')}',
                            height: 68,
                            image: image,
                            width: 120
                        }"
                        partial="Component/Picture/Responsive" />
                </f:if>
            </f:for>
        </div>
    </f:if>
</f:section>
