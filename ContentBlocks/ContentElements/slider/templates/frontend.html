<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
    <f:if condition="{data.image}">
        <section
            aria-label="{data.header}"
            class="position-relative">
            <f:render
                arguments="{
                    configuration: {
                        loop: data.loop_slides,
                        navigation: data.show_navigation,
                        pagination: data.show_pagination ? {clickable: 1} : 0,
                        slidesPerView: 1,
                        spaceBetween: 24
                    },
                    id: 'content-slider-{data.uid}'
                }"
                contentAs="slides"
                partial="Component/Swiper">
                <f:for
                    as="image"
                    each="{data.image}">
                    <div class="swiper-slide">
                        <f:render
                            arguments="{
                                alt: image.alternative,
                                imageClass: 'd-block img-fluid w-100',
                                sources: {
                                    0: {
                                        media: '(min-width: 1400px)',
                                        srcset: '{f:uri.image(height: 1080, image: image, maxWidth: 1920)}'
                                    },
                                    1: {
                                        media: '(min-width: 1200px)',
                                        srcset: '{f:uri.image(height: 900, image: image, maxWidth: 1600)}'
                                    },
                                    2: {
                                        media: '(min-width: 992px)',
                                        srcset: '{f:uri.image(height: 788, image: image, maxWidth: 1400)}'
                                    },
                                    3: {
                                        media: '(min-width: 768px)',
                                        srcset: '{f:uri.image(height: 675, image: image, maxWidth: 1200)}'
                                    },
                                    4: {
                                        media: '(min-width: 576px)',
                                        srcset: '{f:uri.image(height: 558, image: image, maxWidth: 992)}'
                                    }
                                },
                                src: '{f:uri.image(height: 360, image: image, maxWidth: 640)}'
                            }"
                            partial="Component/Picture/Responsive" />
                    </div>
                </f:for>
            </f:render>

            <f:if condition="{data.header} || {data.bodytext}">
                <div class="carousel-caption d-block">
                    <f:if condition="{data.header}">
                        <f:if condition="{data.header_layout} != 100">
                            <viewHelpers:tag tag="h{viewHelpers:fallback(values: '{0: data.header_layout, 1: 2}')}">{data.header}</viewHelpers:tag>
                        </f:if>
                    </f:if>
                    <f:if condition="{data.bodytext}">
                        <f:format.html>{data.bodytext}</f:format.html>
                    </f:if>
                </div>
            </f:if>
        </section>
    </f:if>
</html>
