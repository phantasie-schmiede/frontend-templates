<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
    <f:asset.script
        identifier="psbits-filter"
        src="EXT:templates/Resources/Public/JavaScript/filter.js"
        type="module" />

    <section class="py-3">
        <div class="container">
            <f:if condition="{data.header}">
                <f:if condition="{data.header_layout} != 100">
                    <viewHelpers:tag
                        class="mb-3"
                        tag="h{viewHelpers:fallback(values: '{0: data.header_layout, 1: 2}')}">
                        {data.header}
                    </viewHelpers:tag>
                </f:if>
            </f:if>
            <f:if condition="{data.bodytext}">
                <div class="mb-4">
                    <f:format.html>{data.bodytext}</f:format.html>
                </div>
            </f:if>

            <f:if condition="{data.enable_filter}">
                <label
                    class="form-label"
                    for="teaser-filter-{data.uid}">
                    <f:translate key="LLL:EXT:templates/ContentBlocks/ContentElements/teaser-grid/language/labels.xlf:filter.label" />
                </label>
                <input
                    aria-controls="teaser-grid-{data.uid}"
                    aria-describedby="teaser-filter-status-{data.uid}"
                    class="form-control mb-4"
                    data-psbits-filter-count="#teaser-filter-status-{data.uid}"
                    data-psbits-filter-target="#teaser-grid-{data.uid} > *"
                    id="teaser-filter-{data.uid}"
                    type="search" />

                <p
                    aria-atomic="true"
                    aria-live="polite"
                    class="mb-4 small text-body-secondary"
                    id="teaser-filter-status-{data.uid}"
                    role="status">
                    <span data-psbits-filter-count-number>{data._grids.teasers -> f:count()}</span>
                    <span data-psbits-filter-count-text="{f:translate(key: 'LLL:EXT:templates/ContentBlocks/ContentElements/teaser-grid/language/labels.xlf:filter.results')}">
                        <f:translate key="LLL:EXT:templates/ContentBlocks/ContentElements/teaser-grid/language/labels.xlf:filter.total" />
                    </span>
                </p>
            </f:if>

            <f:render
                arguments="{
                    id: 'teaser-grid-{data.uid}',
                    itemCount: '{data._grids.teasers -> f:count()}',
                    variant: 'teaser',
                }"
                contentAs="cards"
                partial="Component/CardGrid">
                <f:for
                    as="item"
                    each="{data._grids.teasers}">
                    <f:format.raw>{item.content}</f:format.raw>
                </f:for>
            </f:render>
        </div>
    </section>
</html>
