<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<f:asset.script identifier="psbits-filter" src="EXT:templates/Resources/Public/JavaScript/filter.js" type="module" />

<section class="py-4">
    <div class="container">
        <f:if condition="{data.header}">
            <h2 class="mb-3">{data.header}</h2>
        </f:if>
        <f:if condition="{data.bodytext}">
            <div class="mb-4">
                <f:format.html>{data.bodytext}</f:format.html>
            </div>
        </f:if>

        <f:if condition="{data.enable_filter}">
            <label class="form-label" for="teaser-filter-{data.uid}">Filter</label>
            <input
                class="form-control mb-4"
                data-psbits-filter-target="#teaser-grid-{data.uid} .teaser-grid__item"
                id="teaser-filter-{data.uid}"
                type="search" />
        </f:if>

        <f:render partial="Component/CardGrid" contentAs="cards">
            <div class="row" id="teaser-grid-{data.uid}">
                <f:for as="item" each="{data._grids.teasers}">
                    <div class="col-12 col-md-6 col-xl-4 mb-4 teaser-grid__item">
                        <f:format.raw>{item.content}</f:format.raw>
                    </div>
                </f:for>
            </div>
        </f:render>
    </div>
</section>
</html>
