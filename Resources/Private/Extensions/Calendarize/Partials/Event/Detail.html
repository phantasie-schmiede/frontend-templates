<html
    xmlns:c="http://typo3.org/ns/HDNET/Calendarize/ViewHelpers"
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
    <foundation:translation.registerLanguageFile
        file="EXT:frontend_templates/Resources/Private/Language/Frontend/Extensions/calendarize.xlf" />

    <f:alias map="{event: index.originalObject}">
        <f:variable
            name="heroImage"
            value="{event.images.0}" />
        <f:variable
            name="showGallery"
            value="{f:if(condition: '{event.images -> f:count()} > 1 || ({event.images} && !{settings.detail.layout.showHero})', then: 1)}" />

        <article class="detail-page detail-page--event state-{index.state}">
            <header class="detail-page__header mb-4">
                <h1 class="border-bottom pb-3">{event.title}</h1>
                <dl class="event-meta">
                    <div>
                        <dt>
                            <foundation:translate id="calendarize:date" />
                        </dt>
                        <dd>
                            <f:render
                                arguments="{index: index, hideLocation: 1, hideTime: 1}"
                                partial="DateInformation" />
                        </dd>
                    </div>
                    <div>
                        <dt>
                            <foundation:translate id="calendarize:time" />
                        </dt>
                        <dd>
                            <span>
                                <f:render
                                    arguments="{index: index}"
                                    partial="Date/Time" />
                            </span>
                        </dd>
                    </div>
                    <f:if
                        condition="{event.location} || {event.linkedLocation}">
                        <div>
                            <dt>
                                <foundation:translate
                                    id="calendarize:location" />
                            </dt>
                            <dd>
                                <f:if condition="{event.linkedLocation}">
                                    <f:then>
                                        <f:render
                                            arguments="{index: index, hideDate: 1}"
                                            partial="DateInformation" />
                                    </f:then>
                                    <f:else>{event.location}</f:else>
                                </f:if>
                            </dd>
                        </div>
                    </f:if>

                    <f:if condition="'canceled' == {index.state}">
                        <div>
                            <dt>
                                <foundation:translate id="calendarize:status" />
                            </dt>
                            <dd class="event-status">
                                <foundation:translate
                                    id="calendarize:canceled" />
                            </dd>
                        </div>
                    </f:if>
                </dl>
            </header>

            <f:if condition="{heroImage} && {settings.detail.layout.showHero}">
                <section class="detail-page__hero mb-4 overflow-hidden rounded">
                    <f:render
                        arguments="{
                            file: heroImage,
                            imageClass: 'detail-page__hero-image',
                            loading: 'eager',
                            fetchpriority: 'high',
                            sizes: {
                                mobile: 'calc(100vw - 24px)',
                                tablet: '(min-width: 768px) 696px, 516px',
                                desktop: 'min(calc(100vw - 24px), 960px)'
                            },
                            widths: {
                                mobile: {0: 576, 1: 768},
                                tablet: {0: 992, 1: 1200},
                                desktop: {0: 1400, 1: 1600}
                            }
                        }"
                        partial="Component/Picture/Responsive" />
                </section>
            </f:if>

            <div
                class="event-detail-content {f:if(condition: showGallery, then: 'event-detail-content--with-sidebar')}">
                <div class="event-detail-main">
                    <section class="detail-page__panel mb-4">
                        <f:if condition="{event.abstract}">
                            <div class="detail-page__teaser lead mb-3">
                                {event.abstract -> f:format.nl2br()}
                            </div>
                        </f:if>

                        <div class="detail-page__body">
                            <f:if condition="{event.description}">
                                {event.description -> f:format.html()}
                            </f:if>
                        </div>
                    </section>

                    <div
                        class="align-items-center d-flex detail-page__actions flex-wrap gap-2">
                        <f:if condition="{settings.listPid}">
                            <f:link.page
                                class="btn btn-outline-primary"
                                pageUid="{settings.listPid}">
                                <foundation:translate
                                    id="calendarize:back_to_overview" />
                            </f:link.page>
                        </f:if>

                        <f:if
                            condition="{settings.bookingPid} && {event.bookable} && 'canceled' != {index.state}">
                            <c:link.booking
                                class="btn btn-primary"
                                index="{index}">
                                <foundation:translate
                                    id="calendarize:booking" />
                            </c:link.booking>
                        </f:if>
                    </div>
                </div>

                <f:if condition="{showGallery}">
                    <aside class="event-detail-sidebar">
                        <section class="detail-page__panel mb-4">
                            <h2 class="h5 mb-3">
                                <foundation:translate
                                    id="calendarize:gallery" />
                            </h2>
                            <f:render
                                contentAs="items"
                                partial="Component/Masonry">
                                <f:for
                                    as="image"
                                    each="{event.images}"
                                    iteration="imageIterator">
                                    <f:if
                                        condition="{imageIterator.isFirst} && {settings.detail.layout.showHero}">
                                        <f:then />
                                        <f:else>
                                            <div class="m-masonry__item">
                                                <f:render
                                                    arguments="{
                                                        file: image,
                                                        imageClass: 'img-fluid rounded',
                                                        sizes: {mobile: 'auto, calc(100vw - 24px)', tablet: 'auto, 50vw', desktop: 'auto, 320px'},
                                                        widths: {mobile: {0: 320, 1: 640, 2: 960}, tablet: {0: 320, 1: 640, 2: 960}, desktop: {0: 320, 1: 640, 2: 960}}
                                                    }"
                                                    partial="Component/Picture/Responsive" />
                                            </div>
                                        </f:else>
                                    </f:if>
                                </f:for>
                            </f:render>
                        </section>
                    </aside>
                </f:if>
            </div>
        </article>
    </f:alias>
</html>
