<html
    xmlns:c="http://typo3.org/ns/HDNET/Calendarize/ViewHelpers"
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
    <foundation:translation.registerLanguageFile
        file="EXT:frontend_templates/Resources/Private/Language/Frontend/Extensions/calendarize.xlf" />
    <f:alias map="{event: index.originalObject}">
        <f:if condition="'canceled' == {index.state}">
            <f:variable
                name="subtitle"
                value="{foundation:translate(id: 'calendarize:canceled')}" />
        </f:if>

        <f:variable
            name="additionalContentPrepend"
            value="{f:render(arguments: {index: index}, partial: 'DateInformation')}" />

        <f:if condition="{event.abstract}">
            <f:then>
                <f:variable
                    name="text"
                    value="{event.abstract -> f:format.nl2br()}" />
            </f:then>
            <f:else>
                <f:variable
                    name="text"
                    value="{event.description -> f:format.stripTags() -> f:format.crop(append: '&nbsp;[...]', maxCharacters: 180)}" />
            </f:else>
        </f:if>

        <f:if condition="{settings.detailPid}">
            <f:variable name="additionalContentAppend">
                <c:link.index
                    class="btn btn-primary event-card__action mt-auto"
                    index="{index}">
                    <foundation:translate id="calendarize:details" />
                    <span class="visually-hidden">: {event.title}</span>
                </c:link.index>
            </f:variable>
        </f:if>

        <f:if
            condition="{settings.bookingPid} && {event.bookable} && 'canceled' != {index.state}">
            <f:variable name="additionalContentAppend">
                {additionalContentAppend -> f:format.raw()}
                <c:link.booking
                    class="btn btn-outline-primary event-card__action mt-2"
                    index="{index}">
                    <foundation:translate id="calendarize:booking" />
                    <span class="visually-hidden">: {event.title}</span>
                </c:link.booking>
            </f:variable>
        </f:if>

        <f:if condition="{event.images}">
            <f:variable
                name="image"
                value="{event.images.0}" />
        </f:if>

        <f:render
            arguments="{
            additionalContentAppend: additionalContentAppend,
            additionalContentPrepend: additionalContentPrepend,
            cardClass: 'event-card state-{index.state}',
            headerLevel: settings.list.headerLevel,
            image: image,
            imageSizes: {
                mobile: 'auto, calc(100vw - 24px)',
                tablet: 'auto, (min-width: 768px) 340px, 250px',
                desktop: 'auto, (min-width: 1400px) 422px, (min-width: 1200px) 362px, 302px'
            },
            imageWidths: {
                mobile: {0: 320, 1: 480, 2: 640, 3: 960},
                tablet: {0: 320, 1: 480, 2: 640, 3: 960},
                desktop: {0: 320, 1: 480, 2: 640, 3: 960, 4: 1280}
            },
            subtitle: subtitle,
            text: text,
            title: '{index.originalObject.title -> c:link.index(index: index)}'
        }"
            partial="Component/Card" />
    </f:alias>
</html>
