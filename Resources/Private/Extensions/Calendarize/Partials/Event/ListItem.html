<html
    xmlns:c="http://typo3.org/ns/HDNET/Calendarize/ViewHelpers"
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
    <foundation:translation.registerLanguageFile file="EXT:templates/Resources/Private/Language/Frontend/Extensions/calendarize.xlf" />

    <f:alias map="{event: index.originalObject}">
        <f:if condition="'canceled' == {index.state}">
            <f:variable
                name="subtitle"
                value="{f:translate(key: 'canceled')}" />
        </f:if>

        <f:variable
            name="additionalContentPrepend"
            value="{f:render(arguments: {index: index}, partial: 'DateInformation')}" />

        <f:if condition="{event.abstract}">
            <f:then>
                <f:variable
                    name="text"
                    value="{event.abstract -> f:format.nl2br()}" />
            </f:then>
            <f:else>
                <f:variable
                    name="text"
                    value="{event.description -> f:format.stripTags() -> f:format.crop(append: '&nbsp;[...]', maxCharacters: 180)}" />
            </f:else>
        </f:if>

        <f:if condition="{settings.detailPid}">
            <f:variable name="additionalContentAppend">
                <c:link.index
                    class="btn btn-default btn-primary ms-auto ms-sm-0 mt-auto"
                    index="{index}">
                    <foundation:translate id="calendarize:details" />
                </c:link.index>
            </f:variable>
        </f:if>

        <f:if condition="{settings.bookingPid} && {event.bookable}}">
            <f:variable name="additionalContentAppend">
                {additionalContentAppend -> f:format.raw()}

                <c:link.booking
                    class="btn btn-default btn-primary ms-auto ms-sm-0 mt-auto"
                    index="{index}">
                    <f:translate key="booking" />
                </c:link.booking>
            </f:variable>
        </f:if>

        <f:if condition="{event.images}">
            <f:variable
                name="image"
                value="{event.images.0}" />
            <f:variable
                name="imageCropVariant"
                value="cardPortrait" />
            <f:variable
                name="imageHeight"
                value="320" />
            <f:variable
                name="imageSources"
                value="{0: {cropVariant: 'cardLandscape', height: '180m', image: event.images.0, media: '(min-width: 576px)', width: '320m'}}" />
            <f:variable
                name="imageWidth"
                value="240" />
        </f:if>

        <f:render
            arguments="{
                additionalContentAppend: additionalContentAppend,
                additionalContentPrepend: additionalContentPrepend,
                image: image,
                imageCropVariant: imageCropVariant,
                imageHeight: imageHeight,
                imageSources: imageSources,
                imageWidth: imageWidth,
                subtitle: subtitle,
                text: text,
                title: '{index.originalObject.title -> c:link.index(index: index)}'
            }"
            partial="Component/Card" />
    </f:alias>
</html>
