<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <f:layout name="Default" />

    <f:section name="Main">
        <f:if condition="{indicies -> f:count()}">
            <f:for
                as="index"
                each="{indicies}">
                <f:render
                    arguments="{index: index, settings: settings}"
                    partial="Event/Single" />
            </f:for>
        </f:if>
    </f:section>
</html>
