<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
    <n:excludeDisplayedNews newsItem="{newsItem}" />

    <f:variable name="additionalContentAppend">
        <n:link
            class="btn btn-primary news-card__more mt-auto"
            newsItem="{newsItem}"
            settings="{settings}"
            title="{newsItem.title}">
            <f:translate key="more-link" />
            <span class="visually-hidden">: {newsItem.title}</span>
        </n:link>
    </f:variable>

    <f:if condition="{newsItem.mediaPreviews}">
        <f:then>
            <f:alias map="{mediaElement: newsItem.mediaPreviews.0}">
                <f:variable name="image" value="{mediaElement}" />
            </f:alias>
        </f:then>
        <f:else if="{settings.displayDummyIfNoMedia}">
            <f:variable
                name="imageUrl"
                value="{settings.list.media.dummyImage}" />
        </f:else>
    </f:if>

    <f:variable
        name="text"
        value="{viewHelpers:fallback(values: {0: newsItem.teaser, 1: newsItem.bodytext})}" />

    <f:variable name="metadata">
        <p class="news-card__meta small text-body-secondary">
            <time datetime="{newsItem.datetime -> f:format.date(format: 'c')}">
                <f:format.date
                    date="{newsItem.datetime}"
                    format="{f:translate(key: 'dateFormat')}" />
            </time>
            <f:if condition="{newsItem.firstCategory}">
                <span aria-hidden="true">·</span>
                {newsItem.firstCategory.title}
            </f:if>
        </p>
    </f:variable>

    <f:variable
        name="cardClass"
        value="news-card{f:if(condition: image, else: ' news-card--text-only')}" />
    <f:render
        arguments="{
            additionalContentAppend: additionalContentAppend,
            additionalContentPrepend: metadata,
            cardClass: cardClass,
            headerLevel: settings.list.headerLevel,
            image: image,
            imageUrl: imageUrl,
            imageSizes: {
                mobile: 'auto, calc(100vw - 24px)',
                tablet: 'auto, (min-width: 768px) 340px, 250px',
                desktop: 'auto, (min-width: 1400px) 422px, (min-width: 1200px) 362px, 302px'
            },
            imageWidths: {
                mobile: {0: 320, 1: 480, 2: 640, 3: 960},
                tablet: {0: 320, 1: 480, 2: 640, 3: 960},
                desktop: {0: 320, 1: 480, 2: 640, 3: 960, 4: 1280}
            },
            subtitle: subtitle,
            text: '{text -> f:format.crop(maxCharacters: \'{settings.cropMaxCharacters}\', respectWordBoundaries: \'1\')}',
            title: '{newsItem.title -> n:link(newsItem: newsItem, settings: settings, title: newsItem.title)}'
        }"
        partial="Component/Card" />
</html>
