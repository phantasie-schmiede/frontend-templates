<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers">
    <f:layout name="General" />
    <!--
	=====================
		Templates/News/List.html
-->

    <f:section name="content">
        <!--TYPO3SEARCH_end-->
        <f:if condition="{news}">
            <f:then>
                <f:if
                    condition="!{settings.hidePagination} && {settings.list.paginate.insertAbove}">
                    <f:render
                        arguments="{pagination: pagination.pagination, paginator: pagination.paginator}"
                        partial="List/Pagination" />
                </f:if>
                <div
                    class="o-card-grid news-grid"
                    id="news-container-{contentObjectData.uid}">
                    <f:if condition="{settings.hidePagination}">
                        <f:then>
                            <f:for
                                as="newsItem"
                                each="{news}"
                                iteration="iterator">
                                <f:render
                                    arguments="{iterator: iterator, newsItem: newsItem, settings: settings}"
                                    partial="List/Item" />
                            </f:for>
                        </f:then>
                        <f:else>
                            <f:for
                                as="newsItem"
                                each="{pagination.paginator.paginatedItems}"
                                iteration="iterator">
                                <f:render
                                    arguments="{iterator: iterator, newsItem: newsItem, settings: settings}"
                                    partial="List/Item" />
                            </f:for>
                        </f:else>
                    </f:if>
                </div>
                <f:if
                    condition="!{settings.hidePagination} && {settings.list.paginate.insertBelow}">
                    <f:render
                        arguments="{pagination: pagination.pagination, paginator: pagination.paginator}"
                        partial="List/Pagination" />
                </f:if>
            </f:then>
            <f:else>
                <div class="no-news-found">
                    <f:translate key="list_nonewsfound" />
                </div>
            </f:else>
        </f:if>
        <!--TYPO3SEARCH_begin-->
    </f:section>
</html>
