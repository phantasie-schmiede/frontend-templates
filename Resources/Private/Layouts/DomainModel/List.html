<section data-namespace-typo3-fluid="true"
         xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
         xmlns:psb="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers"
>
    <div class="row">
        <div class="col-12 text-center">
            <h2>
                <psb:translate id="LLL:EXT:{extensionKey}/Resources/Private/Language/Frontend/DomainModels/{domainModel}/list.xlf:heading" />
            </h2>
        </div>
    </div>

    <f:render arguments="{domainModel: domainModel, extensionKey: extensionKey, records: records}" partial="DomainModel/List" />

    <div class="row">
        <div class="col-12">
            <hr />
            <f:link.action action="new" class="btn btn-success">
                <psb:translate id="LLL:EXT:{extensionKey}/Resources/Private/Language/Frontend/DomainModels/{domainModel}/list.xlf:new" />
            </f:link.action>
        </div>
    </div>
</section>
