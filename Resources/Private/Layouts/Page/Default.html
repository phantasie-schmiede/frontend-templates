<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers"
    xmlns:templates="http://typo3.org/ns/PSBits/Templates/ViewHelpers">
    <f:variable
        name="containerClass"
        value="container" />
    <f:variable
        name="siteConfiguration"
        value="{foundation:globalVariables.siteConfiguration(path: 'configuration')}" />
    <f:variable
        name="currentPage"
        value="{templates:globalVariables.currentPage()}" />
    <f:variable
        name="templateSettings"
        value="{templates:globalVariables.settings()}" />

    <f:if condition="{currentPage.tx_templates_bs_container_type}">
        <f:variable
            name="containerClass"
            value="container-{currentPage.tx_templates_bs_container_type}" />
    </f:if>

    <f:render
        arguments="{
            containerClass: containerClass,
            mainNavigation: mainNavigation,
            siteConfiguration: siteConfiguration,
            templateSettings: templateSettings
        }"
        partial="Header" />

    <main id="main-content">
        <f:if condition="{stageContent}">
            <f:render
                arguments="{column: stageContent}"
                partial="Column" />
        </f:if>

        <div class="{containerClass}">
            <f:render
                arguments="{queueIdentifier: 'foundation.general'}"
                partial="../FlashMessages" />

            <f:if condition="{breadcrumbs}">
                <f:render partial="Navigation/Breadcrumb" />
            </f:if>

            <f:render section="Main" />
            <f:render
                arguments="{footerNavigation: footerNavigation}"
                partial="Footer" />
        </div>
    </main>
</html>
