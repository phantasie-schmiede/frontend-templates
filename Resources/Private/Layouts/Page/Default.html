<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<f:variable
    name="siteConfiguration"
    value="{psbFoundation:globalVariables.siteConfiguration(path: 'configuration')}" />

<f:if condition="{data.tx_psbtemplates_bs_container_type}">
    <f:variable
        name="containerType"
        value="-{data.tx_psbtemplates_bs_container_type}" />
</f:if>

<div class="container{containerType}">
    <f:render
        arguments="{mainNavigation: mainNavigation, siteConfiguration: siteConfiguration}"
        partial="Header/{settings.templates.header}" />

    <f:render
        arguments="{queueIdentifier: 'psbFoundation.general'}"
        partial="../FlashMessages" />

    <f:if condition="{breadcrumbs}">
        <f:render partial="Navigation/Breadcrumb" />
    </f:if>

    <f:render section="Main" />
    <f:render
        arguments="{footerNavigation: footerNavigation}"
        partial="Footer" />
</div>
</html>
