<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_templates/Resources/Private/Language/Frontend/Component/alert.xlf" />

<div
    class="alert alert-{type}{f:if(condition: dismissable, then: ' alert-dismissible fade show')}"
    role="alert">
    <f:if condition="{heading}">
        <h4 class="alert-heading">
            {heading}
        </h4>
    </f:if>

    {message}

    <f:if condition="{dismissable}">
        <button
            aria-label="{psbFoundation:translate(id: 'alert:close')}"
            class="btn-close"
            data-bs-dismiss="alert"
            type="button"></button>
    </f:if>
</div>
</html>
