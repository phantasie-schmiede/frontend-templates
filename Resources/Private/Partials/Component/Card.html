<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
<f:variable
    name="headerLevel"
    value="{viewHelpers:fallback(values: '{0: headerLevel, 1: 3}')}" />

<div class="card h-100">
    <div class="row g-0 h-100">
        <f:if condition="{imageUrl}">
            <div class="col-4 col-sm-12">
                <picture>
                    <f:if condition="{desktopImageUrl}">
                        <source
                            media="(min-width: 576px)"
                            srcset="{desktopImageUrl}" />
                    </f:if>

                    <img
                        alt="{alternativeText -> f:or(alternative: image.alternative)}"
                        class="card-image"
                        height="320"
                        src="{imageUrl}"
                        width="240" />
                </picture>
            </div>

            <f:variable
                name="cardBodyColumnClasses"
                value="col-8 col-sm-12" />
        </f:if>

        <div class="{cardBodyColumnClasses -> f:or(alternative: 'col-12')}">
            <div class="card-body d-flex flex-column h-100">
                <f:if condition="{title}">
                    <viewHelpers:tag
                        class="card-title h5"
                        tag="h{headerLevel}">
                        {title -> f:format.raw()}
                    </viewHelpers:tag>

                    <f:variable
                        name="headerLevel"
                        value="{headerLevel + 1}" />
                </f:if>

                <f:if condition="{subtitle}">
                    <viewHelpers:tag
                        class="card-subtitle h6 mb-2 text-body-secondary"
                        tag="h{headerLevel}">
                        {subtitle}
                    </viewHelpers:tag>
                </f:if>

                <f:if condition="{text}">
                    <p class="card-text">
                        {text}
                    </p>
                </f:if>

                {additionalContent -> f:format.raw()}
            </div>
        </div>
    </div>
</div>
</html>
