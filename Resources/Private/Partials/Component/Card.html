<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
<f:variable
    name="headerLevel"
    value="{viewHelpers:fallback(values: '{0: headerLevel, 1: 3}')}" />

<div class="m-card">
    <f:if condition="{imageUrl}">
        <div class="m-card__media">
            <picture>
                <f:if condition="{desktopImageUrl}">
                    <source
                        media="(min-width: 576px)"
                        srcset="{desktopImageUrl}" />
                </f:if>

                <img
                    alt="{alternativeText -> f:or(alternative: image.alternative)}"
                    class="m-card__image"
                    height="320"
                    src="{imageUrl}"
                    width="240" />
            </picture>
        </div>
    </f:if>

    <div class="m-card__body">
        <f:if condition="{title}">
            <viewHelpers:tag
                class="card-title h5"
                tag="h{headerLevel}">
                {title -> f:format.raw()}
            </viewHelpers:tag>

            <f:variable
                name="headerLevel"
                value="{headerLevel + 1}" />
        </f:if>

        <f:if condition="{subtitle}">
            <viewHelpers:tag
                class="card-subtitle h6 text-body-secondary"
                tag="h{headerLevel}">
                {subtitle}
            </viewHelpers:tag>
        </f:if>

        <f:if condition="{text}">
            <p class="card-text mt-2">
                {text}
            </p>
        </f:if>

        {additionalContent -> f:format.raw()}
    </div>
</div>
</html>
