<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
    <f:variable
        name="headerLevel"
        value="{viewHelpers:fallback(values: '{0: headerLevel, 1: 3}')}" />

    <div class="m-card">
        <f:if condition="{image} || {imageUrl}">
            <div class="m-card__media">
                <f:if condition="{imageLink}">
                    <f:then>
                        <a href="{imageLink}">
                            <f:render
                                arguments="{_all}"
                                section="Image" />
                        </a>
                    </f:then>
                    <f:else>
                        <f:render
                            arguments="{_all}"
                            section="Image" />
                    </f:else>
                </f:if>
            </div>
        </f:if>

        <div class="m-card__body">
            <f:if condition="{title}">
                <viewHelpers:tag
                    class="card-title h5{f:if(condition: '!{subtitle}', then: ' mb-2')}"
                    tag="h{headerLevel}">
                    {title -> f:format.raw()}
                </viewHelpers:tag>

                <f:variable
                    name="headerLevel"
                    value="{headerLevel + 1}" />
            </f:if>

            <f:if condition="{subtitle}">
                <viewHelpers:tag
                    class="card-subtitle h6 mb-2 text-body-secondary"
                    tag="h{headerLevel}">
                    {subtitle}
                </viewHelpers:tag>
            </f:if>

            {additionalContentPrepend -> f:format.raw()}

            <f:if condition="{text}">
                <div class="card-text mb-3">{text -> f:format.raw()}</div>
            </f:if>

            {additionalContentAppend -> f:format.raw()}
        </div>
    </div>

    <f:section name="Image">
        <f:if condition="{image}">
            <f:then>
                <f:render
                    arguments="{
                        alt: alternativeText,
                        imageClass: 'm-card__image',
                        sources: {
                            0: {
                                media: '(min-width: 1400px)',
                                srcset: '{f:uri.image(cropVariant: \'cardLandscape\', height: \'225m\', image: image, width: \'400m\')}'
                            },
                            1: {
                                media: '(min-width: 1200px)',
                                srcset: '{f:uri.image(cropVariant: \'cardLandscape\', height: \'203m\', image: image, width: \'360m\')}'
                            },
                            2: {
                                media: '(min-width: 992px)',
                                srcset: '{f:uri.image(cropVariant: \'cardLandscape\', height: \'180m\', image: image, width: \'320m\')}'
                            },
                            3: {
                                media: '(min-width: 768px)',
                                srcset: '{f:uri.image(cropVariant: \'cardLandscape\', height: \'158m\', image: image, width: \'280m\')}'
                            },
                            4: {
                                media: '(min-width: 576px)',
                                srcset: '{f:uri.image(cropVariant: \'cardLandscape\', height: \'135m\', image: image, width: \'240m\')}'
                            }
                        },
                        src: '{f:uri.image(cropVariant: \'cardPortrait\', height: \'320m\', image: image, width: \'240m\')}'
                    }"
                    partial="Component/Picture/Responsive" />
            </f:then>
            <f:else>
                <f:variable
                    name="cardSources"
                    value="0" />

                <f:if condition="{desktopImageUrl}">
                    <f:variable
                        name="cardSources"
                        value="{
                            0: {media: '(min-width: 1400px)', srcset: desktopImageUrl},
                            1: {media: '(min-width: 1200px)', srcset: desktopImageUrl},
                            2: {media: '(min-width: 992px)', srcset: desktopImageUrl},
                            3: {media: '(min-width: 768px)', srcset: desktopImageUrl},
                            4: {media: '(min-width: 576px)', srcset: desktopImageUrl}
                        }" />
                </f:if>

                <f:render
                    arguments="{
                        alt: alternativeText,
                        imageClass: 'm-card__image',
                        sources: cardSources,
                        src: imageUrl
                    }"
                    partial="Component/Picture/Responsive" />
            </f:else>
        </f:if>
    </f:section>
</html>
