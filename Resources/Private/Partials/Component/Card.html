<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
    <f:variable
        name="headerLevel"
        value="{viewHelpers:fallback(values: '{0: headerLevel, 1: 3}')}" />

    <div class="m-card">
        <f:if condition="{image}">
            <div class="m-card__media">
                <f:if condition="{imageLink}">
                    <f:then>
                        <a href="{imageLink}">
                            <f:render
                                arguments="{_all}"
                                section="Image" />
                        </a>
                    </f:then>
                    <f:else>
                        <f:render
                            arguments="{_all}"
                            section="Image" />
                    </f:else>
                </f:if>
            </div>
        </f:if>

        <div class="m-card__body">
            <f:if condition="{title}">
                <viewHelpers:tag
                    class="card-title h5{f:if(condition: '!{subtitle}', then: ' mb-2')}"
                    tag="h{headerLevel}">
                    {title -> f:format.raw()}
                </viewHelpers:tag>

                <f:variable
                    name="headerLevel"
                    value="{headerLevel + 1}" />
            </f:if>

            <f:if condition="{subtitle}">
                <viewHelpers:tag
                    class="card-subtitle h6 mb-2 text-body-secondary"
                    tag="h{headerLevel}">
                    {subtitle}
                </viewHelpers:tag>
            </f:if>

            {additionalContentPrepend -> f:format.raw()}

            <f:if condition="{text}">
                <div class="card-text mb-3">{text -> f:format.raw()}</div>
            </f:if>

            {additionalContentAppend -> f:format.raw()}
        </div>
    </div>

    <f:section name="Image">
        <f:render
            arguments="{
                alt: alternativeText,
                file: image,
                imageClass: 'm-card__image',
            }"
            partial="Component/Picture/Responsive" />
    </f:section>
</html>
