<html data-namespace-typo3-fluid="true" xmlns:psbvh="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
    <psbvh:tag additionalAttributes="{additionalAttributes}" aria-controls="{id}" aria-expanded="{f:if(condition: initiallyOpen, then: 'true', else: 'false')}" class="{f:if(condition: initiallyOpen, then: classes, else: '{classes} collapsed')}" data-bs-target="#{id}" data-bs-toggle="collapse" tag="{tag}"> {label -> f:format.raw()} </psbvh:tag>
    <div class="collapse{f:if(condition: initiallyOpen, then: ' show')}" id="{id}">{content -> f:format.raw()}</div>
</html>
