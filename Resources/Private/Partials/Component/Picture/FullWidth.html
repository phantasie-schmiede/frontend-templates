<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<picture class="{pictureClass}">
    <f:for
        as="source"
        each="{
           0: {
               media: '(min-width: 1200px)',
               srcset: '{f:uri.image(image: image, maxWidth: 1600)}'
           },
           1: {
               media: '(min-width: 992px)',
               srcset: '{f:uri.image(image: image, maxWidth: 1199)}'
           },
           2: {
               media: '(min-width: 768px)',
               srcset: '{f:uri.image(image: image, maxWidth: 991)}'
           },
           3: {
               media: '(min-width: 576px)',
               srcset: '{f:uri.image(image: image, maxWidth: 767)}'
           },
           4: {
               media: '(max-width: 575px)',
               srcset: '{f:uri.image(image: image, maxWidth: 575)}'
           }
       }">
        <source
            media="{source.media}"
            srcset="{source.srcset}" />
    </f:for>

    <f:image
        alt="{image.alternative}"
        class="{imageClass}"
        image="{image}" />
</picture>
</html>
