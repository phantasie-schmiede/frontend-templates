<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <f:comment>
        <!--
            This partial is responsible for preloading the images used in the Picture component.
            It must be included in the <head> section of the HTML document to ensure that the images are preloaded before they are needed in the content.
            It generates <link> tags with the same crop variants, sizes and widths as the visible LCP image.
        -->
    </f:comment>
    <f:render
        arguments="{cropVariants: cropVariants, file: file, preload: 1, sizes: sizes, widths: widths}"
        partial="Component/Picture/Sources" />
</html>
