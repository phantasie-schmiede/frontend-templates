<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:templates="http://typo3.org/ns/PSBits/Templates/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
<f:variable
    name="aiStatus"
    value="{file.properties.tx_templates_ai_status -> f:or(alternative: file.originalResource.properties.tx_templates_ai_status)}" />
<f:variable
    name="aiStatusLabel"
    value="" />
<f:variable
    name="copyright"
    value="{file.properties.tx_templates_copyright -> f:or(alternative: file.originalResource.properties.tx_templates_copyright)}" />
<f:variable
    name="metaPosition"
    value="{metaPosition -> f:or(alternative: 'below')}" />
<f:switch expression="{aiStatus}">
    <f:case value="created">
        <f:variable
            name="aiStatusLabel"
            value="{f:translate(key: 'LLL:EXT:templates/Resources/Private/Language/Frontend/Enum/aiStatus.xlf:created')}" />
    </f:case>
    <f:case value="modified">
        <f:variable
            name="aiStatusLabel"
            value="{f:translate(key: 'LLL:EXT:templates/Resources/Private/Language/Frontend/Enum/aiStatus.xlf:modified')}" />
    </f:case>
</f:switch>
<f:variable
    name="metaClass"
    value="{f:if(condition: '{metaPosition} == \'overlay\'', then: 'bottom-0 d-block end-0 p-2 position-absolute text-body-secondary text-end', else: 'd-block mt-2 text-body-secondary text-end')}" />
<f:variable
    name="defaultCropVariants"
    value="{
        mobile: {
            maxWidth: 576,
            mediaQuery: '(max-width: 576px)'
        },
        tablet: {
            maxWidth: 992,
            mediaQuery: '(min-width: 577px) and (max-width: 992px)'
        },
        desktop: {
            maxWidth: 1600,
            mediaQuery: '(min-width: 993px)'
        },
    }" />
<f:variable
    name="defaultSize"
    value="100vw" />
<f:variable
    name="fileExtensions"
    value="{
        0: 'avif',
        1: 'webp',
    }" />

<div class="picture-meta-wrapper position-relative">
    <f:render
        arguments="{_all}"
        section="Picture" />
    <f:if condition="{copyright} || {aiStatusLabel}">
        <small class="{metaClass}">
            <f:if condition="{copyright}">
                © {copyright}
            </f:if>
            <f:if condition="{copyright} && {aiStatusLabel}">
                <span aria-hidden="true">·</span>
            </f:if>
            <f:if condition="{aiStatusLabel}">
                {aiStatusLabel}
            </f:if>
        </small>
    </f:if>
</div>

<f:section name="Picture">
    <picture>
        <f:for
            as="data"
            each="{cropVariants -> f:or(alternative: defaultCropVariants)}"
            key="cropVariant">
            <f:variable
                name="aspectRatio"
                value="{templates:image.aspectRatio(cropVariant: cropVariant, file: file)}" />

            <f:comment>
                <!-- Current data is stored in an extra variable to be able to access the last data for the img tag outside of this loop -->
            </f:comment>
            <f:variable
                name="data"
                value="{data}" />

            <f:for
                as="fileExtension"
                each="{fileExtensions}">
                <f:variable
                    name="customSizes"
                    value="{sizes.{cropVariant}}" />
                <f:variable
                    name="customWidths"
                    value="{widths.{cropVariant}}" />

                <source
                    height="{f:ceil(value: '{data.maxWidth / aspectRatio}')}"
                    media="{data.mediaQuery}"
                    sizes="{customSizes -> f:or(alternative: defaultSize)}"
                    srcset="{f:render(arguments: {
                        cropVariant: cropVariant,
                        file: file,
                        fileExtension: fileExtension,
                        widths: customWidths,
                    }, partial: 'Component/Picture/SourceSet') -> templates:format.reduceWhitespace()}"
                    type="image/{fileExtension}"
                    width="{data.maxWidth}" />
            </f:for>
        </f:for>

        <f:image
            additionalAttributes="{
                alt: alt,
                title: title,
            }"
            class="{imageClass -> f:or(alternative: 'img-fluid')}"
            cropVariant="desktop"
            decoding="{decoding -> f:or(alternative: 'async')}"
            height="{f:ceil(value: '{data.maxWidth / aspectRatio}')}"
            image="{file}"
            loading="{loading -> f:or(alternative: 'lazy')}"
            width="{data.maxWidth}" />
    </picture>
</f:section>
</html>
