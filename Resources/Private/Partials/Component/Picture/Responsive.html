<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:frontendTemplates="http://typo3.org/ns/PSBits/FrontendTemplates/ViewHelpers">
    <f:variable
        name="aiStatus"
        value="{frontendTemplates:image.aiStatus(file: file)}" />
    <f:variable
        name="aiStatusLabel"
        value="{aiStatus.label}" />
    <f:variable
        name="copyright"
        value="{file.properties.tx_frontendtemplates_copyright -> f:or(alternative: file.originalResource.properties.tx_frontendtemplates_copyright)}" />
    <f:variable
        name="figureClass"
        value="{figureClass -> f:or(alternative: 'position-relative')}" />
    <f:variable
        name="metaPosition"
        value="{metaPosition -> f:or(alternative: 'below')}" />
    <f:variable
        name="metaAlignment"
        value="{metaAlignment -> f:or(alternative: 'end')}" />

    <f:if condition="'overlay' == {metaPosition}">
        <f:then>
            <f:variable
                name="metaClass"
                value="bottom-0 d-block p-2 picture-meta picture-meta--overlay position-absolute z-1" />

            <f:if condition="'start' == {metaAlignment}">
                <f:then>
                    <f:variable
                        name="metaClass"
                        value="{metaClass} start-0 text-start" />
                </f:then>
                <f:else>
                    <f:variable
                        name="metaClass"
                        value="{metaClass} end-0 text-end" />
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <f:variable
                name="metaClass"
                value="d-block mt-1 picture-meta text-body-secondary text-{metaAlignment}" />
        </f:else>
    </f:if>

    <figure class="{figureClass}">
        <f:render
            arguments="{_all}"
            section="Picture" />

        <f:if condition="{copyright} || {aiStatusLabel}">
            <figcaption class="picture-meta-caption">
                <small class="{metaClass}">
                    <f:if condition="{copyright}">© {copyright}</f:if>
                    <f:if condition="{copyright} && {aiStatusLabel}">
                        <span
                            aria-hidden="true"
                            class="picture-meta__separator">
                            ·
                        </span>
                    </f:if>
                    <f:if condition="{aiStatusLabel}">{aiStatusLabel}</f:if>
                </small>
            </figcaption>
        </f:if>
    </figure>

    <f:section name="Picture">
        <picture>
            <f:render
                arguments="{_all}"
                partial="Component/Picture/Sources" />
            <f:image
                alt="{alt}"
                class="{imageClass -> f:or(alternative: 'img-fluid')}"
                cropVariant="{fallbackCropVariant -> f:or(alternative: 'desktop')}"
                decoding="{decoding -> f:or(alternative: 'async')}"
                fetchpriority="{fetchpriority -> f:or(alternative: 'auto')}"
                image="{file}"
                loading="{loading -> f:or(alternative: 'lazy')}"
                maxWidth="{fallbackWidth -> f:or(alternative: 1600)}"
                title="{title}" />
        </picture>
    </f:section>
</html>
