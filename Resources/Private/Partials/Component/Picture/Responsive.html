<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
    <viewHelpers:variable.arrayMerge
        arrays="{
            0: {
                1400: 1920,
                1200: 1600,
                992: 1400,
                768: 1200,
                576: 992,
                0: 575
            },
            1: sizes
        }"
        as="sizes"
        overwrite="1" />

    <f:if condition="{sources}">
        <f:variable
            name="responsiveSources"
            value="{sources}" />
    </f:if>

    <f:if condition="{image}">
        <f:variable
            name="responsiveSrcset"
            value="{f:uri.image(height: height, image: image, maxWidth: sizes.0)} {sizes.0}w, {f:uri.image(height: height, image: image, maxWidth: sizes.576)} {sizes.576}w, {f:uri.image(height: height, image: image, maxWidth: sizes.768)} {sizes.768}w, {f:uri.image(height: height, image: image, maxWidth: sizes.992)} {sizes.992}w, {f:uri.image(height: height, image: image, maxWidth: sizes.1200)} {sizes.1200}w, {f:uri.image(height: height, image: image, maxWidth: sizes.1400)} {sizes.1400}w" />
        <f:variable
            name="responsiveSizes"
            value="auto, (min-width: 1400px) {sizes.1400}px, (min-width: 1200px) {sizes.1200}px, (min-width: 992px) {sizes.992}px, (min-width: 768px) {sizes.768}px, (min-width: 576px) {sizes.576}px, {sizes.0}px" />
    </f:if>

    <picture class="{pictureClass}">
        <f:for
            as="source"
            each="{responsiveSources}">
            <source
                media="{source.media}"
                sizes="{source.sizes}"
                srcset="{source.srcset}" />
        </f:for>

        <f:if condition="{src}">
            <f:then>
                <f:variable
                    name="imageSrc"
                    value="{src}" />
            </f:then>
            <f:else>
                <f:if condition="{image}">
                    <f:variable
                        name="imageSrc"
                        value="{f:uri.image(height: height, image: image, maxWidth: sizes.0)}" />
                </f:if>
            </f:else>
        </f:if>

        <f:if condition="{responsiveSrcset}">
            <f:then>
                <img
                    alt="{alt -> f:or(alternative: image.alternative)}"
                    class="{imageClass -> f:or(alternative: 'img-fluid')}"
                    decoding="{decoding -> f:or(alternative: 'async')}"
                    loading="{loading -> f:or(alternative: 'lazy')}"
                    sizes="{responsiveSizes}"
                    src="{imageSrc}"
                    srcset="{responsiveSrcset}" />
            </f:then>
            <f:else>
                <img
                    alt="{alt -> f:or(alternative: image.alternative)}"
                    class="{imageClass -> f:or(alternative: 'img-fluid')}"
                    decoding="{decoding -> f:or(alternative: 'async')}"
                    loading="{loading -> f:or(alternative: 'lazy')}"
                    src="{imageSrc}" />
            </f:else>
        </f:if>
    </picture>
</html>
