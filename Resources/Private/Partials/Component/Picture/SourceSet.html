<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:frontendTemplates="http://typo3.org/ns/PSBits/FrontendTemplates/ViewHelpers">
    <f:variable
        name="defaultWidths"
        value="{
            mobile: {
                0: 400, 1: 800, 2: 1200, 3: 1800
            },
            tablet: {
                0: 800, 1: 1200, 2: 1600, 3: 2400
            },
            desktop: {
                0: 1200, 1: 1600, 2: 2000, 3: 2560
            }
        }" />

    <f:variable
        name="variantWidths"
        value="{defaultWidths.{cropVariant}}" />
    <f:variable
        name="candidateWidths"
        value="{widths -> f:or(alternative: variantWidths)}" />
    <f:for
        as="candidate"
        each="{frontendTemplates:image.sourceSet(cropVariant: cropVariant, file: file, fileExtension: fileExtension, widths: candidateWidths)}"
        iteration="iterator">
        {candidate.uri} {candidate.width}w{f:if(condition: '!{iterator.isLast}',
        then: ',')}
    </f:for>
</html>
