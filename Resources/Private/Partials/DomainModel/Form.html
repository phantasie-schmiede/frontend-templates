<section data-namespace-typo3-fluid="true"
         xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
         xmlns:psb="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers"
         xmlns:psbTemplates="http://typo3.org/ns/PSB/PsbTemplates/ViewHelpers"
>
    <div class="row">
        <div class="col-12 text-center">
            <h2>
                <psb:translate id="LLL:EXT:{extensionKey}/Resources/Private/Language/Frontend/DomainModels/{domainModel}/{languageFile}.xlf:heading" />
            </h2>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <f:form action="{action}" controller="{controller}" method="post" name="record" object="{record}">
                <psbTemplates:domainModel.getTcaConfiguration domainModel="{domainModelClass}" />

                <f:for as="configuration" each="{properties}" key="propertyName">
                    <f:render arguments="{_all}" partial="DomainModel/FormField" />
                </f:for>

                <f:if condition="{returnUrl}">
                    <f:form.hidden name="returnUrl" value="{returnUrl}" />
                </f:if>

                <f:variable name="submitButtonValue" value="{psb:translate(id: 'LLL:EXT:{extensionKey}/Resources/Private/Language/Frontend/DomainModels/{domainModel}/{languageFile}.xlf:submit')}" />
                <f:render arguments="{value: submitButtonValue}" partial="FormFields/Submit" />

                <f:if condition="{returnUrl}">
                    <f:then>
                        <f:link.external class="btn btn-light" uri="{returnUrl}">Back</f:link.external>
                    </f:then>
                    <f:else>
                        <button class="btn btn-light" onclick="window.history.back();">Back</button>
                    </f:else>
                </f:if>
            </f:form>
        </div>
    </div>
</section>
