<section data-namespace-typo3-fluid="true"
         xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
         xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
         xmlns:psb="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers"
>
    <div class="row">
        <div class="col-12">
            <f:if condition="{records}">
                <f:then>
                    <ul class="list-group">
                        <f:for as="record" each="{records}">
                            <li class="list-group-item">
                                <div class="btn-group" role="group" aria-label="Record operations">

                                    <f:variable name="domainModel" value="{psb:getClassName(object: record)}" />

                                    <f:link.action action="delete" arguments="{record: record, returnUrl: returnUrl}" class="btn btn-light" controller="{domainModel}">
                                        <core:icon identifier="actions-delete" size="small" />
                                    </f:link.action>
                                    <f:link.action action="edit" arguments="{record: record, returnUrl: returnUrl}" class="btn btn-light" controller="{domainModel}">
                                        <core:icon identifier="actions-document-open" size="small" />
                                    </f:link.action>
                                </div>

                                <f:variable name="displayName" value="{record.displayName}" />

                                <f:if condition="{displayName}">
                                    <f:else>
                                        <f:variable name="displayName" value="{record.name}" />
                                    </f:else>
                                </f:if>

                                <f:if condition="{displayName}">
                                    <f:else>
                                        <f:variable name="displayName" value="{record.title}" />
                                    </f:else>
                                </f:if>

                                <f:link.action action="show" arguments="{record: record, returnUrl: returnUrl}" controller="{domainModel}">{displayName}</f:link.action>
                            </li>
                        </f:for>
                    </ul>
                </f:then>
                <f:else>
                    <div class="alert alert-info">
                        <p>
                            <psb:translate id="LLL:EXT:{extensionKey}/Resources/Private/Language/Frontend/DomainModels/{domainModel}/list.xlf:noRecords" />
                        </p>
                    </div>
                </f:else>
            </f:if>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <hr />
            <f:link.action action="new" arguments="{returnUrl: returnUrl}" class="btn btn-success" controller="{domainModel}">
                <psb:translate id="LLL:EXT:{extensionKey}/Resources/Private/Language/Frontend/DomainModels/{domainModel}/list.xlf:new" />
            </f:link.action>
        </div>
    </div>
</section>
