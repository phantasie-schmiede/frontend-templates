<section data-namespace-typo3-fluid="true"
         xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
>
    <f:if condition="{record.{propertyName}}">
        <f:variable name="records" value="{record.{propertyName}}" />
        <f:variable name="returnUrl" value="{f:uri.page(absolute: 'true', addQueryString: 'true')}" />

        <f:render arguments="{domainModel: linkedModelShortName, extensionKey: extensionKey, records: records, returnUrl: returnUrl}" partial="DomainModel/List" />
    </f:if>
</section>
