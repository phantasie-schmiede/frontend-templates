<section data-namespace-typo3-fluid="true"
         xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
>
    <f:form.select
        class="form-control"
        id="{propertyName}"
        multiple="{f:if(condition: configuration.MM, then: 'true', else: 'false')}"
        options="{configuration.items}"
        optionValueField="{f:if(condition: '{valueField}', then: '{valueField}', else: 'uid')}"
        optionLabelField="{labelField}"
        property="{propertyName}"
    />
</section>
