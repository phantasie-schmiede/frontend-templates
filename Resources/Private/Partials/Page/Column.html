<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <f:for
        as="contentElement"
        each="{column}">
        <f:if condition="{unstyled}">
            <f:then>
                <f:cObject
                    data="{contentElement.data}"
                    table="tt_content"
                    typoscriptObjectPath="tt_content.{contentElement.data.CType}" />
            </f:then>
            <f:else>
                <div
                    class="page-content-element{f:if(condition: '{contentElement.data.CType} == \'header\'', then: ' page-content-element--header')}{f:if(condition: contentElement.data.space_before_class, then: ' page-content-element--space-before')}{f:if(condition: contentElement.data.space_after_class, then: ' page-content-element--space-after')}">
                    <f:cObject
                        data="{contentElement.data}"
                        table="tt_content"
                        typoscriptObjectPath="tt_content.{contentElement.data.CType}" />
                </div>
            </f:else>
        </f:if>
    </f:for>
</html>
