<section data-namespace-typo3-fluid="true"
         xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
         xmlns:psb="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers"
>
    <f:variable name="siteConfiguration" value="{psb:globalVariables(path: 'siteConfiguration.configuration')}" />

    <div class="row sticky-top">
        <nav class="bg-light col-12 navbar navbar-expand-lg navbar-light">
            <f:link.page class="align-self-start navbar-brand" pageUid="{siteConfiguration.rootPageId}">
                <f:if condition="{siteConfiguration.websiteLogo}">
                    <img alt="{siteConfiguration.websiteTitle}" class="d-inline-block align-top" src="{f:uri.image(height: '100m', src: siteConfiguration.websiteLogo)}" />
                </f:if>
            </f:link.page>

            <div class="flex-lg-column">
                <span class="h1 header-title pl-2">{siteConfiguration.websiteTitle}</span>
                <button aria-controls="navbarToggler" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-target="#navbarToggler" data-toggle="collapse" type="button">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse text-right text-lg-left" id="navbarToggler">
                    <f:cObject typoscriptObjectPath="lib.mainMenu" />
                    <f:if condition="{siteConfiguration.searchResultPid}">
                        <form action="{f:uri.page(pageUid: siteConfiguration.searchResultPid)}" class="form-inline my-2 my-lg-0">
                            <input class="form-control mr-sm-2" type="search" placeholder="Search" aria-label="Search">
                            <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
                        </form>
                    </f:if>
                    <f:if condition="{siteConfiguration.frontendUserPid}">
                        <div class="dropdown">
                        <span aria-expanded="false" aria-haspopup="true" data-toggle="dropdown" id="dropdownLoginButton">
                            <f:image alt="Login-Icon" src="EXT:psb_templates/Resources/Public/Icons/login-avatar.svg" width="50m" />
                        </span>
                            <div aria-labelledby="dropdownLoginButton" class="dropdown-menu p-2" style="width: 200px;">
                                <form action="/" method="post">
                                    <f:security.ifAuthenticated>
                                        <f:then>
                                            <button class="btn btn-primary" type="submit">Logout</button>
                                            <input name="logintype" type="hidden" value="logout">
                                        </f:then>
                                        <f:else>
                                            <div class="form-group">
                                                <label for="user">Username</label>
                                                <input class="form-control" id="user" name="user" type="text"><span role="status" aria-live="polite" class="cip-ui-helper-hidden-accessible">2 results are available, use up and down arrow keys to navigate.</span>
                                            </div>
                                            <div class="form-group">
                                                <label for="pass">Password</label>
                                                <input class="form-control" id="pass" name="pass" type="password">
                                            </div>
                                            <button class="btn btn-primary" type="submit">Login</button>
                                            <input name="logintype" type="hidden" value="login">
                                            <input name="pid" type="hidden" value="{siteConfiguration.frontendUserPid}">
                                            <input name="redirect_url" type="hidden" value="">
                                            <input name="tx_felogin_pi1[noredirect]" type="hidden" value="1">

                                            <f:if condition="{siteConfiguration.resetPasswordPid}">
                                                <p>
                                                    <f:link.page additionalParams="{tx_felogin_pi1: '{forgot: 1}'}" pageUid="{siteConfiguration.resetPasswordPid}" rel="nofollow">
                                                        Passwort vergessen?
                                                    </f:link.page>
                                                </p>
                                            </f:if>
                                        </f:else>
                                    </f:security.ifAuthenticated>
                                </form>
                            </div>
                        </div>
                    </f:if>
                </div>
            </div>
        </nav>
        <f:cObject typoscriptObjectPath="lib.breadcrumb" />
    </div>
</section>
