<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers">
<foundation:translation.registerLanguageFile file="EXT:templates/Resources/Private/Language/Frontend/Page/header.xlf" />

<header>
    <nav class="bg-body-tertiary navbar navbar-expand-lg">
        <div class="{containerClass}">
            <f:if condition="{settings.logos.default.file}">
                <f:link.page
                    class="navbar-brand"
                    pageUid="{siteConfiguration.rootPageId}">
                    <f:render
                        arguments="{siteConfiguration: siteConfiguration}"
                        partial="Header/Logo" />
                </f:link.page>
            </f:if>

            <button
                aria-controls="offcanvasNavbar"
                aria-label="Toggle navigation"
                class="collapsed navbar-toggler"
                data-bs-target="#offcanvasNavbar"
                data-bs-toggle="offcanvas"
                type="button">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                aria-labelledby="offcanvasNavbarLabel"
                class="offcanvas offcanvas-end"
                id="offcanvasNavbar"
                tabindex="-1">
                <div class="offcanvas-header">
                    <h5
                        class="offcanvas-title"
                        id="offcanvasNavbarLabel">
                        <foundation:translate id="header:menu" />
                    </h5>
                    <button
                        aria-label="Close"
                        class="btn-close"
                        data-bs-dismiss="offcanvas"
                        type="button"></button>
                </div>
                <div class="justify-content-center offcanvas-body">
                    <ul class="navbar-nav text-end">
                        <f:render
                            arguments="{mainNavigation: mainNavigation}"
                            partial="Navigation/Main" />
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
</html>
