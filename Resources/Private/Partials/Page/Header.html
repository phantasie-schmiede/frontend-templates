<section data-namespace-typo3-fluid="true"
         xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
         xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers"
         xmlns:psbTemplates="http://typo3.org/ns/PSB/PsbTemplates/ViewHelpers"
>
    <f:variable name="translationPath" value="LLL:EXT:psb_templates/Resources/Private/Language/Frontend/Page/header.xlf:" />
    <f:variable name="siteConfiguration" value="{psbFoundation:globalVariables(path: 'siteConfiguration.configuration')}" />

    <nav class="bg-dark fixed-top navbar navbar-dark navbar-expand-lg navbar-light">
        <f:link.page class="navbar-brand" pageUid="{siteConfiguration.rootPageId}">
            <f:if condition="{siteConfiguration.websiteLogo}">
                <img alt="{siteConfiguration.websiteTitle}" class="d-inline-block align-top" src="{f:uri.image(height: '100m', src: siteConfiguration.websiteLogo)}" />
            </f:if>
            {siteConfiguration.websiteTitle}
        </f:link.page>

        <button aria-controls="navbarToggler" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-target="#navbarToggler" data-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarToggler">
            <f:cObject typoscriptObjectPath="lib.mainMenu" />
            <f:if condition="{siteConfiguration.searchResultPid}">
                <form action="{f:uri.page(pageUid: siteConfiguration.searchResultPid)}" class="form-inline my-2 my-lg-0">
                    <input aria-label="{psbFoundation:translate(id: '{translationPath}search')}" class="form-control mr-sm-2" placeholder="{psbFoundation:translate(id: '{translationPath}search')}" type="search">
                    <button class="btn btn-outline-success my-2 my-sm-0" type="submit">
                        <psbFoundation:translate id="{translationPath}search" />
                    </button>
                </form>
            </f:if>
            <f:if condition="{siteConfiguration.frontendUserPid}">
                <div class="dropdown">
                <span aria-expanded="false" aria-haspopup="true" data-toggle="dropdown" id="dropdownLoginButton">
                    <psbTemplates:svgSprite color="white" icon="person-circle" />
                </span>
                    <div aria-labelledby="dropdownLoginButton" class="dropdown-menu dropdown-menu-right p-2">
                        <form action="/" method="post">
                            <f:security.ifAuthenticated>
                                <f:then>
                                    <p>{frontendUser.username}</p>
                                    <button class="btn btn-block btn-primary" type="submit">
                                        <psbFoundation:translate id="{translationPath}logout" />
                                    </button>
                                    <input name="logintype" type="hidden" value="logout">
                                </f:then>
                                <f:else>
                                    <div class="form-group">
                                        <label for="user">
                                            <psbFoundation:translate id="{translationPath}username" />
                                        </label>
                                        <input class="form-control" id="user" name="user" type="text">
                                    </div>
                                    <div class="form-group">
                                        <label for="pass">
                                            <psbFoundation:translate id="{translationPath}password" />
                                        </label> <input class="form-control" id="pass" name="pass" type="password">
                                    </div>
                                    <button class="btn btn-primary" type="submit">
                                        <psbFoundation:translate id="{translationPath}login" />
                                    </button>
                                    <input name="logintype" type="hidden" value="login">
                                    <input name="pid" type="hidden" value="{siteConfiguration.frontendUserPid}">
                                    <input name="redirect_url" type="hidden" value="">
                                    <input name="tx_felogin_pi1[noredirect]" type="hidden" value="1">

                                    <f:if condition="{siteConfiguration.resetPasswordPid}">
                                        <p>
                                            <f:link.page additionalParams="{tx_felogin_pi1: '{forgot: 1}'}" pageUid="{siteConfiguration.resetPasswordPid}" rel="nofollow">
                                                <psbFoundation:translate id="{translationPath}forgotPassword" />
                                            </f:link.page>
                                        </p>
                                    </f:if>
                                </f:else>
                            </f:security.ifAuthenticated>
                        </form>
                    </div>
                </div>
            </f:if>
        </div>
    </nav>
    <f:cObject typoscriptObjectPath="lib.breadcrumb" />
</section>
