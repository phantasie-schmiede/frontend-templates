<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:psbFoundation="http://typo3.org/ns/PSB/PsbFoundation/ViewHelpers">
<psbFoundation:translation.registerLanguageFile file="EXT:psb_templates/Resources/Private/Language/Frontend/Page/header.xlf" />

<header>
    <nav class="bg-body-tertiary fixed-top navbar navbar-expand-lg">
        <div class="container-fluid">
            <f:link.page
                class="navbar-brand"
                pageUid="{siteConfiguration.rootPageId}">
                <f:render
                    arguments="{siteConfiguration: siteConfiguration}"
                    partial="Header/Components/Logo" />
            </f:link.page>

            <button
                aria-controls="offcanvasNavbar"
                aria-label="Toggle navigation"
                class="navbar-toggler"
                data-bs-target="#offcanvasNavbar"
                data-bs-toggle="offcanvas"
                type="button">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                aria-labelledby="offcanvasNavbarLabel"
                class="offcanvas offcanvas-end"
                id="offcanvasNavbar"
                tabindex="-1">
                <div class="offcanvas-header">
                    <h5
                        class="offcanvas-title"
                        id="offcanvasNavbarLabel">{siteConfiguration.websiteTitle}</h5>
                    <button
                        aria-label="Close"
                        class="btn-close"
                        data-bs-dismiss="offcanvas"
                        type="button"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="flex-grow-1 navbar-nav text-end">
                        <f:render
                            arguments="{mainNavigation: mainNavigation}"
                            partial="PsbNavigation/Main" />
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
</html>
