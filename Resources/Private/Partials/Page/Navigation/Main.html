<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <f:for
        as="page"
        each="{mainNavigation}">
        <li class="nav-item{f:if(condition: '{100} == {page.data.doktype} && {page.hasSubpages}', then: ' dropdown')}">
            <f:if condition="{page.current}">
                <f:then>
                    <a
                        aria-current="page"
                        class="active nav-link"
                        href="{page.link}">
                        {page.title}
                    </a>
                </f:then>
                <f:else if="{100} == {page.data.doktype} && {page.hasSubpages}">
                    <button
                        aria-controls="submenu-{page.data.uid}"
                        aria-expanded="false"
                        class="dropdown-toggle nav-link"
                        data-bs-toggle="dropdown"
                        type="button">
                        {page.title}
                    </button>
                    <ul
                        class="dropdown-menu"
                        id="submenu-{page.data.uid}">
                        <f:for
                            as="subPage"
                            each="{page.children}">
                            <li>
                                <f:if condition="{subPage.current}">
                                    <f:then>
                                        <a
                                            aria-current="page"
                                            class="active nav-link"
                                            href="{subPage.link}">
                                            {subPage.title}
                                        </a>
                                    </f:then>
                                    <f:else>
                                        <a
                                            class="nav-link"
                                            href="{subPage.link}">
                                            {subPage.title}
                                        </a>
                                    </f:else>
                                </f:if>
                            </li>
                        </f:for>
                    </ul>
                </f:else>
                <f:else>
                    <a
                        class="nav-link"
                        href="{page.link}">
                        {page.title}
                    </a>
                </f:else>
            </f:if>
        </li>
    </f:for>
</html>
