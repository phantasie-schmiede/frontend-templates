<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<ul class="navbar-nav flex-grow-1 pe-3">
    <f:for
        as="page"
        each="{mainNavigation}">
        <li class="nav-item">
            <f:if condition="{page.isCurrentPage}">
                <f:then>
                    <f:link.page
                        additionalAttributes="{aria-current: 'page'}"
                        class="active nav-link"
                        pageUid="{page.uid}">
                        {page.nav_title}
                    </f:link.page>
                </f:then>
                <f:else>
                    <f:link.page
                        class="nav-link"
                        pageUid="{page.uid}">
                        {page.nav_title}
                    </f:link.page>
                </f:else>
            </f:if>
        </li>
    </f:for>
</ul>
</html>
