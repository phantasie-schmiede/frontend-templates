<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<f:for
    as="page"
    each="{mainNavigation}">
    <li class="nav-item">
        <f:if condition="{page.isCurrentPage}">
            <f:then>
                <a
                    aria-current="page"
                    class="active nav-link"
                    href="{page.link}">
                    {page.title}
                </a>
            </f:then>
            <f:else>
                <a
                    class="nav-link"
                    href="{page.link}">
                    {page.title}
                </a>
            </f:else>
        </f:if>
    </li>
</f:for>
</html>
