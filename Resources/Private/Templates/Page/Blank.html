<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <f:layout name="Blank" />

    <f:section name="Main">
        <f:if condition="{rowHighlightClass1}">
            <f:then>
                <div class="{rowHighlightClass1}">
                    <f:render
                        arguments="{column: content1}"
                        partial="Column" />
                </div>
            </f:then>
            <f:else>
                <f:render
                    arguments="{column: content1}"
                    partial="Column" />
            </f:else>
        </f:if>
    </f:section>
</html>
