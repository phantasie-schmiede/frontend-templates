<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<f:layout name="Default" />

<f:section name="Main">
    <div class="row">
        <div class="col-md-4">
            <f:render
                arguments="{column: column1}"
                partial="Column" />
        </div>
        <div class="col-md-8">
            <f:render
                arguments="{column: column2}"
                partial="Column" />
        </div>
    </div>
</f:section>
</html>
