<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
    <f:layout name="Default" />

    <f:section name="Main">
        <div class="row {rowHighlightClass1}">
            <div class="col-md-3">
                <f:render
                    arguments="{column: content1}"
                    partial="Column" />
            </div>
            <div class="col-md-9">
                <f:render
                    arguments="{column: content2}"
                    partial="Column" />
            </div>
        </div>
    </f:section>
</html>
