<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<div class="progress">
    <div aria-valuemax="{maxValue}"
         aria-valuemin="{minValue}"
         aria-valuenow="{value}"
         class="{classes}"
         role="progressbar"
         style="width: {percentage}%">
    </div>
</div>
</html>
