<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:foundation="http://typo3.org/ns/PSBits/Foundation/ViewHelpers"
    xmlns:templates="http://typo3.org/ns/PSBits/Templates/ViewHelpers"
    xmlns:viewHelpers="http://typo3.org/ns/PSBits/ViewHelpers/ViewHelpers">
<foundation:translation.registerLanguageFile file="EXT:templates/Resources/Private/Language/Frontend/Component/loadingSpinner.xlf" />

<viewHelpers:tag
    additionalAttributes="{additionalAttributes}"
    class="{classes -> f:format.trim()}"
    data="{data}"
    tag="{tag}">
    <f:if condition="{iconIdentifier}">
        <templates:svgIcon identifier="{iconIdentifier}" />
        &nbsp;
    </f:if>

    {label}
</viewHelpers:tag>
</html>
