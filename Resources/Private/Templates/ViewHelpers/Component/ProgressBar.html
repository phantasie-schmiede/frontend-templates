<html data-namespace-typo3-fluid="true">
    <div class="progress">
        <div
            aria-valuemax="{maxValue}"
            aria-valuemin="{minValue}"
            aria-valuenow="{value}"
            class="progress-bar {classes}"
            role="progressbar"
            style="width: {percentage}%"
        >
            {content}
        </div>
    </div>
</html>
